  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g transform="translate(228 228) scale(8.875)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M17 50L53 14"/>
