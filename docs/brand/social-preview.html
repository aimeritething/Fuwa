<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; }
  body {
    background: linear-gradient(180deg, #141416 0%, #09090a 100%);
    color: #ffffff;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  .row { display: flex; align-items: center; gap: 56px; }
  .tile {
    width: 200px; height: 200px; border-radius: 45px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #2b2b30 0%, #101012 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 24px 48px -16px rgba(0,0,0,0.6);
  }
  .text { display: flex; flex-direction: column; gap: 18px; }
  .name { font-size: 72px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .line { font-size: 26px; font-weight: 400; color: #949597; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="row">
    <div class="tile">
      <svg viewBox="0 0 64 64" width="138" height="138" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M17 50L53 14"/><path d="M47 20H39"/><path d="M39 28H25"/><path d="M31 36H11"/></svg>
    </div>
    <div class="text">
      <div class="name">Fuwa</div>
      <div class="line">Read and edit Markdown in a folder on your disk.</div>
    </div>
  </div>
</body>
</html>
